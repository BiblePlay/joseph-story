<!doctype html>
<html lang="ko">

<head>
<meta charset="utf-8">

<meta
  name="viewport"
  content="width=device-width,initial-scale=1,viewport-fit=cover"
>

<meta name="theme-color" content="#ffffff">

<title>요셉과 형제들</title>

<style>

/* =========================
   기본
========================= */

*{
  box-sizing:border-box;
}

html{
  scroll-behavior:auto;
}

body{
  margin:0;
  background:#fff;
  color:#111;

  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Apple SD Gothic Neo",
    "Noto Sans KR",
    "Malgun Gothic",
    sans-serif;
}


/* =========================
   상단 회차 메뉴
========================= */

.top{
  position:sticky;
  top:0;
  z-index:100;

  background:#fff;

  border-bottom:1px solid #e8e8e8;

  padding:8px;
}

.episodes{
  max-width:860px;
  margin:0 auto;

  display:grid;
  grid-template-columns:repeat(5,1fr);

  gap:5px;
}

.episode-button{
  appearance:none;
  -webkit-appearance:none;

  border:1px solid #d7d7d7;

  background:#fff;
  color:#111;

  border-radius:9px;

  padding:9px 2px;

  font-family:inherit;
  font-size:14px;
  font-weight:650;

  cursor:pointer;

  outline:none;

  -webkit-tap-highlight-color:transparent;

  touch-action:manipulation;
}

.episode-button.active{
  background:#111;
  color:#fff;
  border-color:#111;
}

.episode-button:focus{
  outline:none;
}

.episode-button:focus-visible{
  outline:none;
}

.episode-button:active{
  transform:none;
}


/* =========================
   만화
========================= */

.reader{
  max-width:860px;

  margin:0 auto;

  background:#fff;

  min-height:100vh;
}

.page{
  display:block;

  width:100%;
  height:auto;

  margin:0;
  padding:0;

  border:0;
}


/* =========================
   하단 영역
========================= */

.episode-end{
  max-width:860px;

  margin:0 auto;

  padding:22px 14px 8px;

  background:#fff;
}


/*
회차 전환 중에는
하단 버튼 영역을 완전히 숨김
*/

.episode-end.switching{
  visibility:hidden;
}


/* 다음 화 버튼 */

.next-episode{
  appearance:none;
  -webkit-appearance:none;

  display:block;

  width:100%;

  border:0;

  background:#111;
  color:#fff;

  border-radius:12px;

  padding:17px 10px;

  font-family:inherit;

  font-size:18px;
  font-weight:700;

  cursor:pointer;

  outline:none;

  -webkit-tap-highlight-color:transparent;

  touch-action:manipulation;
}

.next-episode:focus{
  outline:none;
}

.next-episode:active{
  transform:none;
}


/* 마지막 */

.the-end{
  text-align:center;

  padding:10px 10px 4px;

  font-size:16px;
  font-weight:650;

  color:#555;
}


/* =========================
   교회명
========================= */

.footer{
  text-align:center;

  color:#777;

  font-size:16px;
  font-weight:500;

  letter-spacing:.02em;

  padding:22px 10px 30px;
}


/* =========================
   PC
========================= */

@media(min-width:861px){

  body{
    background:#f3f3f3;
  }

  .reader,
  .episode-end{
    background:#fff;
  }

  .reader{
    box-shadow:0 0 0 1px #eee;
  }

}

</style>
</head>


<body>


<!-- =========================
     상단 회차
========================= -->

<nav
  class="top"
  aria-label="회차 선택"
>

<div class="episodes">

  <button
    type="button"
    class="episode-button active"
    data-episode="1"
  >
    1화
  </button>

  <button
    type="button"
    class="episode-button"
    data-episode="2"
  >
    2화
  </button>

  <button
    type="button"
    class="episode-button"
    data-episode="3"
  >
    3화
  </button>

  <button
    type="button"
    class="episode-button"
    data-episode="4"
  >
    4화
  </button>

  <button
    type="button"
    class="episode-button"
    data-episode="5"
  >
    5화
  </button>

</div>

</nav>


<!-- =========================
     만화
========================= -->

<main
  class="reader"
  id="reader"
>

  <img
    class="page"
    id="page1"
    src="01-1.png"
    alt="1화 1페이지"
  >

  <img
    class="page"
    id="page2"
    src="01-2.png"
    alt="1화 2페이지"
  >

</main>


<!-- =========================
     하단
========================= -->

<div
  class="episode-end"
  id="episodeEnd"
>

  <button
    type="button"
    class="next-episode"
    id="nextEpisode"
  >
    2화 보기 →
  </button>

</div>


<footer class="footer">
부산진교회 초등2부
</footer>


<script>

/* =========================
   브라우저 스크롤 복원 방지
========================= */

if('scrollRestoration' in history){
  history.scrollRestoration='manual';
}


/* =========================
   기본 설정
========================= */

const total=5;

let currentEpisode=1;

let changing=false;


const page1=
  document.getElementById('page1');

const page2=
  document.getElementById('page2');

const episodeEnd=
  document.getElementById('episodeEnd');

const buttons=
  Array.from(
    document.querySelectorAll(
      '.episode-button'
    )
  );


/* =========================
   이미지 파일명
========================= */

function getSources(ep){

  const number=
    String(ep).padStart(2,'0');

  return [
    number+'-1.png',
    number+'-2.png'
  ];

}


/* =========================
   이미지 미리 로딩
========================= */

function preload(src){

  return new Promise(
    function(resolve,reject){

      const image=new Image();

      image.onload=function(){
        resolve();
      };

      image.onerror=function(){
        reject();
      };

      image.src=src;

      if(image.complete){
        resolve();
      }

    }
  );

}


/* =========================
   현재 화 버튼 표시
========================= */

function setActiveButton(ep){

  buttons.forEach(
    function(button){

      const number=
        Number(
          button.dataset.episode
        );

      if(number===ep){

        button.classList.add(
          'active'
        );

      }else{

        button.classList.remove(
          'active'
        );

      }

      button.blur();

    }
  );

}


/* =========================
   하단 다음 화 버튼
========================= */

function updateBottom(ep){

  if(ep<total){

    episodeEnd.innerHTML=
      '<button '+
      'type="button" '+
      'class="next-episode" '+
      'id="nextEpisode">'+
      (ep+1)+
      '화 보기 →'+
      '</button>';


    document
      .getElementById('nextEpisode')
      .addEventListener(
        'click',
        function(){

          changeEpisode(ep+1);

        }
      );

  }else{

    episodeEnd.innerHTML=
      '<div class="the-end">'+
      '요셉과 형제들 · 끝'+
      '</div>';

  }

}


/* =========================
   회차 변경
========================= */

async function changeEpisode(ep){

  if(
    changing ||
    ep<1 ||
    ep>total ||
    ep===currentEpisode
  ){
    return;
  }


  changing=true;


  /*
  ★ 핵심 수정

  회차 이동이 시작되는 순간
  검은 '다음 화 보기' 버튼을
  먼저 숨긴다.
  */

  episodeEnd.classList.add(
    'switching'
  );


  const sources=
    getSources(ep);


  try{

    /*
    현재 화면을 유지한 상태에서
    새 이미지 두 장을 먼저 준비
    */

    await Promise.all([

      preload(sources[0]),

      preload(sources[1])

    ]);


    /*
    화면 최상단으로 이동
    */

    window.scrollTo(0,0);


    /*
    기존 IMG 요소는 그대로 두고
    이미지 주소만 교체
    */

    page1.src=sources[0];

    page1.alt=
      ep+'화 1페이지';


    page2.src=sources[1];

    page2.alt=
      ep+'화 2페이지';


    currentEpisode=ep;


    /*
    상단 검은 회차 표시 변경
    */

    setActiveButton(ep);


    /*
    새로운 다음 화 버튼 준비
    */

    updateBottom(ep);


    /*
    브라우저가 새 레이아웃을
    실제로 그린 다음 처리
    */

    requestAnimationFrame(
      function(){

        window.scrollTo(0,0);


        requestAnimationFrame(
          function(){

            /*
            ★ 새 화면이 자리 잡은 뒤에만
            하단 버튼을 다시 표시
            */

            episodeEnd.classList.remove(
              'switching'
            );

          }
        );

      }
    );

  }

  catch(error){

    console.error(
      '이미지 로딩 오류',
      error
    );

    /*
    오류가 나도 버튼은 다시 표시
    */

    episodeEnd.classList.remove(
      'switching'
    );

  }


  changing=false;

}


/* =========================
   상단 회차 버튼
========================= */

buttons.forEach(
  function(button){

    button.addEventListener(
      'click',
      function(){

        const ep=
          Number(
            button.dataset.episode
          );

        changeEpisode(ep);

      }
    );

  }
);


/* =========================
   최초 다음 화 버튼
========================= */

document
  .getElementById('nextEpisode')
  .addEventListener(
    'click',
    function(){

      changeEpisode(2);

    }
  );


/* =========================
   나머지 이미지 미리 로딩
========================= */

window.addEventListener(
  'load',
  function(){

    window.scrollTo(0,0);


    setTimeout(
      function(){

        for(
          let ep=2;
          ep<=total;
          ep++
        ){

          const sources=
            getSources(ep);

          preload(
            sources[0]
          ).catch(
            function(){}
          );

          preload(
            sources[1]
          ).catch(
            function(){}
          );

        }

      },
      500
    );

  }
);


/* =========================
   이전 hash 제거
========================= */

if(location.hash){

  history.replaceState(
    null,
    '',
    location.pathname+
    location.search
  );

}


/* =========================
   첫 화면
========================= */

currentEpisode=1;

setActiveButton(1);

window.scrollTo(0,0);

</script>

</body>
</html>
