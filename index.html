<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ffffff">

<title>요셉과 형제들</title>

<style>
*{
  box-sizing:border-box;
}

html{
  scroll-behavior:auto;
}

body{
  margin:0;
  background:#fff;
  color:#111;
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Apple SD Gothic Neo",
    "Noto Sans KR",
    "Malgun Gothic",
    sans-serif;
}

/* 상단 회차 메뉴 */
.top{
  position:sticky;
  top:0;
  z-index:10;
  background:rgba(255,255,255,.97);
  border-bottom:1px solid #e8e8e8;
  padding:8px;
}

.episodes{
  max-width:860px;
  margin:auto;
  display:grid;
  grid-template-columns:repeat(5,1fr);
  gap:5px;
}

.episodes button{
  border:1px solid #d7d7d7;
  background:#fff;
  border-radius:9px;
  padding:9px 2px;
  font-size:14px;
  font-weight:650;
  cursor:pointer;
}

.episodes button.active{
  background:#111;
  color:#fff;
  border-color:#111;
}

/* 만화 */
.reader{
  max-width:860px;
  margin:0 auto;
  background:#fff;
}

.page{
  display:block;
  width:100%;
  height:auto;
  margin:0;
  padding:0;
}

/* 화 마지막 영역 */
.episode-end{
  max-width:860px;
  margin:0 auto;
  padding:22px 14px 8px;
  background:#fff;
}

/* 다음 화 버튼 */
.next-episode{
  display:block;
  width:100%;
  border:0;
  background:#111;
  color:#fff;
  border-radius:12px;
  padding:17px 10px;
  font-size:18px;
  font-weight:700;
  cursor:pointer;
}

/* 마지막 화 */
.the-end{
  text-align:center;
  padding:10px 10px 4px;
  font-size:16px;
  font-weight:650;
  color:#555;
}

/* 교회명 */
.footer{
  text-align:center;
  color:#777;
  font-size:16px;
  font-weight:500;
  letter-spacing:.02em;
  padding:22px 10px 30px;
}

/* PC 화면 */
@media(min-width:861px){

  body{
    background:#f3f3f3;
  }

  .reader,
  .episode-end{
    background:#fff;
  }

  .reader{
    box-shadow:0 0 0 1px #eee;
  }

  .top{
    background:rgba(255,255,255,.97);
  }
}
</style>
</head>

<body>

<nav class="top" aria-label="회차 선택">
  <div class="episodes" id="episodes"></div>
</nav>

<main class="reader" id="reader"></main>

<div class="episode-end" id="episodeEnd"></div>

<footer class="footer">
  부산진교회 초등2부
</footer>

<script>

/* 브라우저가 이전 스크롤 위치를 자동 복원하지 않도록 설정 */
if('scrollRestoration' in history){
  history.scrollRestoration = 'manual';
}

const total = 5;

const episodes = document.getElementById('episodes');
const reader = document.getElementById('reader');
const episodeEnd = document.getElementById('episodeEnd');

let currentEpisode = 1;


/* 회차 화면 만들기 */
function renderEpisode(ep, moveToTop = true){

  currentEpisode = ep;

  /* 상단 1~5화 버튼 */
  episodes.innerHTML = '';

  for(let i = 1; i <= total; i++){

    const button = document.createElement('button');

    button.type = 'button';
    button.textContent = i + '화';

    if(i === ep){
      button.className = 'active';
    }

    button.addEventListener('click', function(){
      changeEpisode(i);
    });

    episodes.appendChild(button);
  }


  /* 해당 화 이미지 2장 */
  const number = String(ep).padStart(2,'0');

  reader.innerHTML =
    `<img
      class="page"
      src="${number}-1.png"
      alt="${ep}화 1페이지"
    >` +
    `<img
      class="page"
      src="${number}-2.png"
      alt="${ep}화 2페이지"
    >`;


  /* 다음 화 버튼 */
  if(ep < total){

    episodeEnd.innerHTML =
      `<button
        type="button"
        class="next-episode"
        id="nextEpisode"
      >
        ${ep + 1}화 보기 →
      </button>`;

    document
      .getElementById('nextEpisode')
      .addEventListener('click', function(){
        changeEpisode(ep + 1);
      });

  }else{

    episodeEnd.innerHTML =
      `<div class="the-end">
        요셉과 형제들 · 끝
      </div>`;
  }


  /* 회차를 바꾸면 항상 최상단 */
  if(moveToTop){

    window.scrollTo(0,0);

    requestAnimationFrame(function(){
      window.scrollTo(0,0);
    });

  }
}


/* 회차 변경 */
function changeEpisode(ep){

  if(ep < 1 || ep > total){
    return;
  }

  renderEpisode(ep,true);
}


/* 최초 접속 */

/* 기존 주소에 #episode-2 등이 남아 있다면 제거 */
if(location.hash){
  history.replaceState(
    null,
    '',
    location.pathname + location.search
  );
}

/* 처음에는 무조건 1화 */
renderEpisode(1,false);

/* 첫 화면 위치를 최상단으로 확실하게 고정 */
window.scrollTo(0,0);

requestAnimationFrame(function(){
  window.scrollTo(0,0);
});

/* 이미지 로딩 완료 후에도 한 번 더 최상단 확인 */
window.addEventListener('load',function(){

  window.scrollTo(0,0);

  setTimeout(function(){
    window.scrollTo(0,0);
  },50);

});

</script>

</body>
</html>
