<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">

<meta
  name="viewport"
  content="width=device-width,initial-scale=1,viewport-fit=cover"
>

<meta name="theme-color" content="#ffffff">

<title>요셉과 형제들</title>

<style>

*{
  box-sizing:border-box;
}

html{
  scroll-behavior:auto;
}

body{
  margin:0;
  background:#fff;
  color:#111;

  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Apple SD Gothic Neo",
    "Noto Sans KR",
    "Malgun Gothic",
    sans-serif;
}


/* =========================
   상단 회차 메뉴
========================= */

.top{
  position:sticky;
  top:0;
  z-index:100;

  background:#fff;

  border-bottom:1px solid #e8e8e8;

  padding:8px;
}

.episodes{
  max-width:860px;
  margin:0 auto;

  display:grid;

  grid-template-columns:
    repeat(5,1fr);

  gap:5px;
}

.episode-button{
  appearance:none;
  -webkit-appearance:none;

  border:1px solid #d7d7d7;

  background:#fff;
  color:#111;

  border-radius:9px;

  padding:9px 2px;

  font-family:inherit;
  font-size:14px;
  font-weight:650;

  cursor:pointer;

  outline:none;

  -webkit-tap-highlight-color:
    transparent;

  touch-action:manipulation;
}


/* 현재 보고 있는 화 */

.episode-button.active{
  background:#111;
  color:#fff;
  border-color:#111;
}


/*
중요:
모바일 브라우저가 터치 순간
임의의 버튼 상태를 표시하지 않도록
hover / focus / active에서
색을 변경하지 않는다.
*/

.episode-button:focus{
  outline:none;
}

.episode-button:focus-visible{
  outline:none;
}

.episode-button:active{
  transform:none;
}


/* =========================
   만화 영역
========================= */

.reader{
  max-width:860px;

  margin:0 auto;

  background:#fff;

  min-height:100vh;
}

.page{
  display:block;

  width:100%;
  height:auto;

  margin:0;
  padding:0;

  border:0;
}


/* =========================
   하단
========================= */

.episode-end{
  max-width:860px;

  margin:0 auto;

  padding:
    22px 14px 8px;

  background:#fff;
}


/* 다음 화 */

.next-episode{
  appearance:none;
  -webkit-appearance:none;

  display:block;

  width:100%;

  border:0;

  background:#111;
  color:#fff;

  border-radius:12px;

  padding:17px 10px;

  font-family:inherit;

  font-size:18px;
  font-weight:700;

  cursor:pointer;

  outline:none;

  -webkit-tap-highlight-color:
    transparent;

  touch-action:manipulation;
}

.next-episode:focus{
  outline:none;
}

.next-episode:active{
  transform:none;
}


/* 마지막 화 */

.the-end{
  text-align:center;

  padding:10px 10px 4px;

  font-size:16px;
  font-weight:650;

  color:#555;
}


/* =========================
   교회명
========================= */

.footer{
  text-align:center;

  color:#777;

  font-size:16px;
  font-weight:500;

  letter-spacing:.02em;

  padding:
    22px 10px 30px;
}


/* =========================
   PC
========================= */

@media(min-width:861px){

  body{
    background:#f3f3f3;
  }

  .reader,
  .episode-end{
    background:#fff;
  }

  .reader{
    box-shadow:
      0 0 0 1px #eee;
  }

}

</style>
</head>


<body>


<!-- =========================
     상단 회차
========================= -->

<nav
  class="top"
  aria-label="회차 선택"
>

<div class="episodes">

  <button
    type="button"
    class="episode-button active"
    data-episode="1"
  >
    1화
  </button>

  <button
    type="button"
    class="episode-button"
    data-episode="2"
  >
    2화
  </button>

  <button
    type="button"
    class="episode-button"
    data-episode="3"
  >
    3화
  </button>

  <button
    type="button"
    class="episode-button"
    data-episode="4"
  >
    4화
  </button>

  <button
    type="button"
    class="episode-button"
    data-episode="5"
  >
    5화
  </button>

</div>

</nav>


<!-- =========================
     만화
========================= -->

<main
  class="reader"
  id="reader"
>

  <img
    class="page"
    id="page1"
    src="01-1.png"
    alt="1화 1페이지"
  >

  <img
    class="page"
    id="page2"
    src="01-2.png"
    alt="1화 2페이지"
  >

</main>


<!-- =========================
     다음 화
========================= -->

<div
  class="episode-end"
  id="episodeEnd"
>

  <button
    type="button"
    class="next-episode"
    id="nextEpisode"
  >
    2화 보기 →
  </button>

</div>


<footer class="footer">

부산진교회 초등2부

</footer>


<script>

/* =========================
   브라우저 스크롤 복원 방지
========================= */

if(
  'scrollRestoration'
  in history
){
  history.scrollRestoration =
    'manual';
}


/* =========================
   요소
========================= */

const total = 5;

let currentEpisode = 1;

let changing = false;


const reader =
  document.getElementById(
    'reader'
  );


const page1 =
  document.getElementById(
    'page1'
  );


const page2 =
  document.getElementById(
    'page2'
  );


const episodeEnd =
  document.getElementById(
    'episodeEnd'
  );


const buttons =
  Array.from(
    document.querySelectorAll(
      '.episode-button'
    )
  );


/* =========================
   이미지 주소
========================= */

function getSources(ep){

  const number =
    String(ep)
    .padStart(2,'0');

  return [

    number + '-1.png',

    number + '-2.png'

  ];

}


/* =========================
   이미지 미리 준비
========================= */

function preload(src){

  return new Promise(
    function(resolve,reject){

      const image =
        new Image();

      image.onload =
        function(){

          resolve();

        };

      image.onerror =
        function(){

          reject();

        };

      image.src = src;


      if(image.complete){

        resolve();

      }

    }
  );

}


/* =========================
   선택된 회차 표시

   버튼을 새로 만들지 않는다.
   기존 버튼의 class만 변경.
========================= */

function setActiveButton(ep){

  buttons.forEach(
    function(button){

      const number =
        Number(
          button.dataset.episode
        );

      if(number === ep){

        button.classList.add(
          'active'
        );

      }else{

        button.classList.remove(
          'active'
        );

      }

      /*
      모바일 브라우저의
      focus 잔상 제거
      */

      button.blur();

    }
  );

}


/* =========================
   하단 버튼
========================= */

function updateBottom(ep){

  if(ep < total){

    episodeEnd.innerHTML =
      '<button ' +
      'type="button" ' +
      'class="next-episode" ' +
      'id="nextEpisode">' +

      (ep + 1) +

      '화 보기 →' +

      '</button>';


    const next =
      document.getElementById(
        'nextEpisode'
      );


    next.addEventListener(
      'click',
      function(){

        changeEpisode(
          ep + 1
        );

      }
    );

  }

  else{

    episodeEnd.innerHTML =
      '<div class="the-end">' +
      '요셉과 형제들 · 끝' +
      '</div>';

  }

}


/* =========================
   회차 변경
========================= */

async function changeEpisode(ep){

  if(
    changing ||
    ep < 1 ||
    ep > total ||
    ep === currentEpisode
  ){
    return;
  }


  changing = true;


  const sources =
    getSources(ep);


  try{

    /*
    새 화 이미지가 준비될 때까지
    현재 화면 유지
    */

    await Promise.all([

      preload(sources[0]),

      preload(sources[1])

    ]);


    /*
    먼저 최상단으로 이동
    */

    window.scrollTo(0,0);


    /*
    기존 IMG 요소 자체는
    없애지 않고 src만 변경
    */

    page1.src =
      sources[0];

    page1.alt =
      ep +
      '화 1페이지';


    page2.src =
      sources[1];

    page2.alt =
      ep +
      '화 2페이지';


    currentEpisode = ep;


    /*
    검은 버튼 이동
    */

    setActiveButton(ep);


    /*
    하단 버튼 변경
    */

    updateBottom(ep);


    /*
    모바일 렌더링 후
    위치 재확인
    */

    requestAnimationFrame(
      function(){

        window.scrollTo(
          0,
          0
        );

      }
    );

  }

  catch(error){

    console.error(
      '이미지 로딩 오류',
      error
    );

  }


  changing = false;

}


/* =========================
   상단 버튼 이벤트

   버튼은 처음 만들어진
   그대로 계속 사용
========================= */

buttons.forEach(
  function(button){

    button.addEventListener(
      'click',
      function(){

        const ep =
          Number(
            button.dataset.episode
          );

        changeEpisode(ep);

      }
    );

  }
);


/* =========================
   2~5화 백그라운드 준비
========================= */

window.addEventListener(
  'load',
  function(){

    window.scrollTo(0,0);


    setTimeout(
      function(){

        for(
          let ep=2;
          ep<=total;
          ep++
        ){

          const sources =
            getSources(ep);

          preload(
            sources[0]
          ).catch(
            function(){}
          );

          preload(
            sources[1]
          ).catch(
            function(){}
          );

        }

      },
      500
    );

  }
);


/* =========================
   예전 hash 제거
========================= */

if(location.hash){

  history.replaceState(

    null,

    '',

    location.pathname +
    location.search

  );

}


/* =========================
   첫 화면
========================= */

currentEpisode = 1;

setActiveButton(1);

window.scrollTo(0,0);

</script>


</body>
</html>
