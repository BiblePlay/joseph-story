<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ffffff">

<title>요셉과 형제들</title>

<style>
*{
  box-sizing:border-box;
}

html{
  scroll-behavior:auto;
}

body{
  margin:0;
  background:#fff;
  color:#111;
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Apple SD Gothic Neo",
    "Noto Sans KR",
    "Malgun Gothic",
    sans-serif;
}

/* 상단 회차 메뉴 */
.top{
  position:sticky;
  top:0;
  z-index:100;
  background:#fff;
  border-bottom:1px solid #e8e8e8;
  padding:8px;
}

.episodes{
  max-width:860px;
  margin:auto;
  display:grid;
  grid-template-columns:repeat(5,1fr);
  gap:5px;
}

.episodes button{
  border:1px solid #d7d7d7;
  background:#fff;
  border-radius:9px;
  padding:9px 2px;
  font-size:14px;
  font-weight:650;
  cursor:pointer;
  -webkit-tap-highlight-color:transparent;
}

.episodes button.active{
  background:#111;
  color:#fff;
  border-color:#111;
}

.episodes button:disabled{
  cursor:default;
}

/* 만화 */
.reader{
  max-width:860px;
  margin:0 auto;
  background:#fff;
  min-height:100vh;
}

.page{
  display:block;
  width:100%;
  height:auto;
  margin:0;
  padding:0;
}

/* 화 마지막 */
.episode-end{
  max-width:860px;
  margin:0 auto;
  padding:22px 14px 8px;
  background:#fff;
}

/* 다음 화 버튼 */
.next-episode{
  display:block;
  width:100%;
  border:0;
  background:#111;
  color:#fff;
  border-radius:12px;
  padding:17px 10px;
  font-size:18px;
  font-weight:700;
  cursor:pointer;
  -webkit-tap-highlight-color:transparent;
}

.next-episode:disabled{
  opacity:.65;
  cursor:default;
}

/* 마지막 */
.the-end{
  text-align:center;
  padding:10px 10px 4px;
  font-size:16px;
  font-weight:650;
  color:#555;
}

/* 교회명 */
.footer{
  text-align:center;
  color:#777;
  font-size:16px;
  font-weight:500;
  letter-spacing:.02em;
  padding:22px 10px 30px;
}

/* PC */
@media(min-width:861px){

  body{
    background:#f3f3f3;
  }

  .reader,
  .episode-end{
    background:#fff;
  }

  .reader{
    box-shadow:0 0 0 1px #eee;
  }
}
</style>
</head>

<body>

<nav class="top" aria-label="회차 선택">
  <div class="episodes" id="episodes"></div>
</nav>

<main class="reader" id="reader"></main>

<div class="episode-end" id="episodeEnd"></div>

<footer class="footer">
  부산진교회 초등2부
</footer>


<script>

/* ---------------------------------
   기본 설정
--------------------------------- */

if('scrollRestoration' in history){
  history.scrollRestoration = 'manual';
}

const total = 5;

const episodes =
  document.getElementById('episodes');

const reader =
  document.getElementById('reader');

const episodeEnd =
  document.getElementById('episodeEnd');

let currentEpisode = 1;

let changing = false;


/* ---------------------------------
   파일 이름
--------------------------------- */

function imageSources(ep){

  const number =
    String(ep).padStart(2,'0');

  return [
    number + '-1.png',
    number + '-2.png'
  ];
}


/* ---------------------------------
   이미지 한 장 미리 로드
--------------------------------- */

function preloadImage(src){

  return new Promise(function(resolve,reject){

    const img = new Image();

    img.onload = function(){
      resolve(src);
    };

    img.onerror = function(){
      reject(src);
    };

    img.src = src;

    /* 이미 캐시에 있을 경우 */
    if(img.complete){

      resolve(src);

    }

  });

}


/* ---------------------------------
   한 화 이미지 모두 준비
--------------------------------- */

function preloadEpisode(ep){

  const sources = imageSources(ep);

  return Promise.all([
    preloadImage(sources[0]),
    preloadImage(sources[1])
  ]);

}


/* ---------------------------------
   상단 회차 버튼
--------------------------------- */

function drawEpisodeButtons(){

  episodes.innerHTML = '';

  for(let i=1; i<=total; i++){

    const button =
      document.createElement('button');

    button.type = 'button';

    button.textContent = i + '화';

    if(i === currentEpisode){
      button.className = 'active';
    }

    button.addEventListener(
      'click',
      function(){

        changeEpisode(i);

      }
    );

    episodes.appendChild(button);

  }

}


/* ---------------------------------
   하단 다음 화 버튼
--------------------------------- */

function drawNextButton(){

  if(currentEpisode < total){

    episodeEnd.innerHTML =
      '<button type="button" ' +
      'class="next-episode" ' +
      'id="nextEpisode">' +
      (currentEpisode + 1) +
      '화 보기 →' +
      '</button>';

    document
      .getElementById('nextEpisode')
      .addEventListener(
        'click',
        function(){

          changeEpisode(
            currentEpisode + 1
          );

        }
      );

  }else{

    episodeEnd.innerHTML =
      '<div class="the-end">' +
      '요셉과 형제들 · 끝' +
      '</div>';

  }

}


/* ---------------------------------
   실제 이미지 표시

   중요:
   새 이미지가 준비된 다음에만
   기존 화면을 교체합니다.
--------------------------------- */

function displayEpisode(ep){

  const sources =
    imageSources(ep);

  const fragment =
    document.createDocumentFragment();


  const image1 =
    document.createElement('img');

  image1.className = 'page';

  image1.src = sources[0];

  image1.alt =
    ep + '화 1페이지';


  const image2 =
    document.createElement('img');

  image2.className = 'page';

  image2.src = sources[1];

  image2.alt =
    ep + '화 2페이지';


  fragment.appendChild(image1);

  fragment.appendChild(image2);


  /*
     먼저 새 이미지 객체를 완성한 후
     기존 만화를 한 번에 교체
  */

  reader.replaceChildren(fragment);


  currentEpisode = ep;

  drawEpisodeButtons();

  drawNextButton();

}


/* ---------------------------------
   회차 변경
--------------------------------- */

async function changeEpisode(ep){

  if(
    changing ||
    ep < 1 ||
    ep > total ||
    ep === currentEpisode
  ){
    return;
  }


  changing = true;


  try{

    /*
       현재 만화는 그대로 둔 상태에서
       새 화의 이미지 두 장을 준비
    */

    await preloadEpisode(ep);


    /*
       이미지 준비가 끝난 뒤
       맨 위로 이동
    */

    window.scrollTo(0,0);


    /*
       그 다음 화면 교체
    */

    displayEpisode(ep);


    /*
       모바일 브라우저의 렌더링 타이밍에
       영향을 받지 않도록 한 번 더 확인
    */

    requestAnimationFrame(function(){

      window.scrollTo(0,0);

    });


  }catch(error){

    console.error(
      '이미지를 불러오지 못했습니다.',
      error
    );

  }


  changing = false;

}


/* ---------------------------------
   최초 1화 표시
--------------------------------- */

function start(){

  currentEpisode = 1;

  displayEpisode(1);

  window.scrollTo(0,0);


  /*
     1화가 표시된 후
     나머지 화를 백그라운드에서
     차례로 미리 받아둠
  */

  setTimeout(function(){

    for(let i=2; i<=total; i++){

      preloadEpisode(i)
        .catch(function(){});

    }

  },300);

}


/* ---------------------------------
   시작
--------------------------------- */

/*
   예전 #episode-2 같은 주소가
   남아 있다면 제거
*/

if(location.hash){

  history.replaceState(
    null,
    '',
    location.pathname +
    location.search
  );

}


/*
   첫 화면 시작
*/

start();


/*
   페이지 전체 로딩 후에도
   첫 접속 위치는 최상단
*/

window.addEventListener(
  'load',
  function(){

    window.scrollTo(0,0);

  }
);

</script>

</body>
</html>
